name: Deploy Plugin to Dev Site

on:
  push:
    branches:
      - dev
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check file structure
        run: |
          ls -la
          find . -name "exclude-list.txt"
      - name: Deploy to gishehcinema.ir
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEV_SERVER: ${{ secrets.DEV_SERVER }}
          DEV_PATH: ${{ secrets.DEV_PATH }}
        run: |
            echo "$SSH_PRIVATE_KEY" > private_key && chmod 600 private_key
            echo "This is a test file" > test.txt
            rsync -av -e "ssh -i private_key -o StrictHostKeyChecking=no" \
             test.txt root@$DEV_SERVER:/var/lib/docker/volumes/gishehcinema2_app/_data/test.txt
            rm -f private_key


              

