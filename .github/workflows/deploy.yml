name: Deploy Plugin to Dev Site

on:
  push:
    branches:
      - dev
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install PHP Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install Node.js Dependencies
        run: npm install

      - name: Build Assets with Webpack
        run: npm run build
        
      - name: Deploy Dev to gishehcinema.ir
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEV_SERVER: ${{ secrets.DEV_SERVER }}
          DEV_PATH: ${{ secrets.DEV_PATH }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key && chmod 600 private_key
          set +e  # اجازه می‌دهد در صورت خطا ادامه دهد
          rsync -avz --exclude-from='.github/exclude-list.txt' \
            -e "ssh -i private_key -o StrictHostKeyChecking=no" \
            ./ root@$DEV_SERVER:$DEV_PATH/
          EXIT_CODE=$?  # ذخیره وضعیت اجرای rsync
          rm -f private_key
          exit $EXIT_CODE  # بازگرداندن کد خروجی rsync

      - name: Ensure private_key is Deleted
        if: always()  # این مرحله همیشه اجرا می‌شود، حتی اگر rsync خطا دهد
        run: |
          if [ -f private_key ]; then
            chmod 600 private_key
            rm -f private_key
            echo "✅ private_key deleted successfully"
          else
            echo "✅ private_key already deleted"
          fi



              

