name: Deploy Plugin to Dev Site

on:
  push:
    branches:
      - dev
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Create Test File
        run: echo "Hello, this is a test file!" > test-file.txt

      - name: Deploy Test File to gishehcinema.ir
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEV_SERVER: ${{ secrets.DEV_SERVER }}
          DEV_PATH: ${{ secrets.DEV_PATH }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key && chmod 600 private_key
          rsync -avz -e "ssh -i private_key -o StrictHostKeyChecking=no" test-file.txt root@$DEV_SERVER:$DEV_PATH/
          rm -f private_key

              

