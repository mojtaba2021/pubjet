name: Build Plugin and Create Clean ZIP

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 1) Test on every supported PHP version.
  #    If anything fails here, no ZIP is built.
  # ------------------------------------------------------------------
  compat:
    name: PHP ${{ matrix.php }} compatibility
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.2', '8.3']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Install PHP Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: PHP syntax check
        run: |
          find . -name "*.php" \
            -not -path "./node_modules/*" \
            -not -path "./vendor/*/tests/*" \
            -not -path "./vendor/*/Tests/*" \
            -not -path "./vendor/*/Resources/stubs/*" \
            -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      # This is exactly what a customer's site does when it loads the plugin.
      # If vendor/composer/platform_check.php demands a newer PHP, it fails here.
      - name: Autoload / Composer platform check
        run: php -r "require 'vendor/autoload.php'; echo 'Autoload OK on PHP ' . PHP_VERSION . PHP_EOL;"

  # ------------------------------------------------------------------
  # 2) Build the release ZIP on the MINIMUM supported PHP (7.4),
  #    only after all compatibility tests pass.
  # ------------------------------------------------------------------
  build-and-zip:
    needs: compat
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Verify platform check does not require PHP 8
        run: |
          php -r "require 'vendor/autoload.php'; echo 'Autoload OK' . PHP_EOL;"
          if grep -q "PHP_VERSION_ID >= 80" vendor/composer/platform_check.php; then
            echo "::error::vendor/composer/platform_check.php requires PHP 8+"
            cat vendor/composer/platform_check.php
            exit 1
          fi

      - name: Install Node.js Dependencies
        run: npm ci

      - name: Build Assets with Webpack
        run: npm run build

      - name: Create Clean ZIP of Plugin
        id: create-zip
        run: |
          VERSION=$(grep -m1 -i "Version:" pubjet.php | awk '{print $2}' | tr -d '\r')
          ZIP_FILE="pubjet-${VERSION}-$(date +'%Y%m%d%H%M%S').zip"
          echo "Creating ZIP: $ZIP_FILE"

          # Files go inside a "pubjet/" folder so that installing the ZIP
          # from wp-admin replaces the existing plugin instead of creating a new one.
          mkdir -p build/pubjet
          # IMPORTANT: every pattern starts with "/" so it only matches at the
          # repository root. Without it, "src/" would also delete vendor/*/src
          # (Sentry, Guzzle, ...) and break the plugin.
          rsync -a ./ build/pubjet/ \
            --exclude="/.git/" \
            --exclude="/.gitignore" \
            --exclude="/.gitattributes" \
            --exclude="/.github/" \
            --exclude="/build/" \
            --exclude="/node_modules/" \
            --exclude="/src/" \
            --exclude="/version" \
            --exclude="/debug.txt" \
            --exclude="/.idea/" \
            --exclude="/.editorconfig" \
            --exclude="/composer.json" \
            --exclude="/composer.lock" \
            --exclude="/package.json" \
            --exclude="/package-lock.json" \
            --exclude="/.babelrc" \
            --exclude="/webpack.dev.js" \
            --exclude="/webpack.prod.js"

          cd build
          zip -qr "$ZIP_FILE" pubjet
          echo "ZIP created: $ZIP_FILE"
          echo "zip_file=build/$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # Test the FINAL ZIP itself (what customers will install), not the working directory.
      - name: Verify the built ZIP
        run: |
          rm -rf /tmp/zipcheck && mkdir /tmp/zipcheck
          unzip -q "${{ steps.create-zip.outputs.zip_file }}" -d /tmp/zipcheck
          cd /tmp/zipcheck/pubjet
          test -f pubjet.php || { echo "::error::pubjet.php not at pubjet/ root"; exit 1; }
          # every file Composer loads on startup must exist
          php -r '
            require "vendor/autoload.php";
            foreach (["Sentry\\SentrySdk", "Sentry\\ClientBuilder", "GuzzleHttp\\Psr7\\Request",
                      "Psr\\Log\\LoggerInterface", "Symfony\\Component\\OptionsResolver\\OptionsResolver"] as $c) {
              if (!class_exists($c) && !interface_exists($c)) { fwrite(STDERR, "Missing class: $c\n"); exit(1); }
            }
            echo "ZIP autoload OK on PHP " . PHP_VERSION . PHP_EOL;
          '
          find . -name "*.php" -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          echo "Files in ZIP: $(find . -type f | wc -l)"

      - name: Upload ZIP as Artifact
        uses: actions/upload-artifact@v5
        with:
          name: pubjet-dev-zip
          path: ${{ steps.create-zip.outputs.zip_file }}

  # ------------------------------------------------------------------
  # 3) Install real WordPress on each PHP version, install the PREVIOUS
  #    release from wordpress.org, update it to the new ZIP (like a
  #    customer would), then load the site, wp-admin and the settings page.
  # ------------------------------------------------------------------
  wordpress-smoke-test:
    name: WordPress smoke test (PHP ${{ matrix.php }})
    needs: build-and-zip
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.2', '8.3']
    env:
      # Version currently live on wordpress.org that customers update FROM.
      # Change this after every release.
      PREV_VERSION: '5.4.6'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, curl, gd, mbstring, xml, zip, intl
          tools: wp-cli

      - name: Download built ZIP
        uses: actions/download-artifact@v5
        with:
          name: pubjet-dev-zip
          path: dist

      - name: Install WordPress
        run: |
          mkdir wp && cd wp
          wp core download --quiet
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp config set WP_DEBUG true --raw
          wp config set WP_DEBUG_LOG true --raw
          wp config set WP_DEBUG_DISPLAY false --raw
          wp core install --url=http://127.0.0.1:8080 --title="Pubjet Test" \
            --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          echo "WordPress $(wp core version) on PHP $(php -r 'echo PHP_VERSION;')"

      - name: Install previous release from wordpress.org
        working-directory: wp
        run: wp plugin install pubjet --version="$PREV_VERSION" --activate

      - name: Update to the new build (same as a customer update)
        working-directory: wp
        run: |
          wp plugin install ../dist/*.zip --force --activate
          wp plugin list --name=pubjet --fields=name,status,version
          wp plugin is-active pubjet

      - name: Load WordPress with the plugin (CLI)
        working-directory: wp
        run: |
          wp eval 'echo "WordPress loaded with pubjet on PHP " . PHP_VERSION . PHP_EOL;'
          wp cron event run --due-now

      - name: HTTP smoke test (front-end, login, wp-admin, settings page)
        working-directory: wp
        run: |
          wp server --host=127.0.0.1 --port=8080 > /tmp/server.log 2>&1 &
          sleep 3
          BASE=http://127.0.0.1:8080

          # log in as admin
          curl -s -c /tmp/cookies -b "wordpress_test_cookie=WP%20Cookie%20check" \
            -d "log=admin&pwd=admin&wp-submit=Log+In&testcookie=1" \
            -o /dev/null "$BASE/wp-login.php"

          fail=0
          for path in "/" "/wp-login.php" "/wp-admin/" "/wp-admin/plugins.php" "/wp-admin/admin.php?page=pubjet_settings"; do
            code=$(curl -s -L -b /tmp/cookies -o /tmp/page.html -w "%{http_code}" "$BASE$path")
            echo "$path -> HTTP $code"
            if [ "$code" -ge 500 ] || grep -qiE "Composer detected issues|critical error|Fatal error" /tmp/page.html; then
              echo "::error::$path is broken"
              head -c 3000 /tmp/page.html
              fail=1
            fi
          done
          exit $fail

      - name: Check debug.log
        if: always()
        working-directory: wp
        run: |
          LOG=wp-content/debug.log
          if [ -f "$LOG" ]; then
            echo "----- debug.log -----"
            cat "$LOG"
            if grep -q "PHP Fatal error" "$LOG"; then
              echo "::error::Fatal errors found in debug.log"
              exit 1
            fi
          else
            echo "debug.log is empty"
          fi