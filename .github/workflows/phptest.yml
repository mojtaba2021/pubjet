name: PHP compatibility
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install dependencies
        run: composer install --no-dev -o --no-interaction
      - name: Syntax check
        run: find . -name "*.php" -not -path "./vendor/*/tests/*" -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Autoload / platform check
        run: php -r "require 'vendor/autoload.php'; echo 'OK';"